# Regola di reindirizzamento forzato dal vecchio al nuovo dominio
[[redirects]]
  from = "https://orienteeringpiacenza.netlify.app/*"
  to = "https://www.orienteeringpiacenza.it/:splat"
  status = 301
  force = true

# La cartella di appoggio _to_delete/ non deve mai essere raggiungibile dal sito,
# anche se per errore venisse pubblicata
[[redirects]]
  from = "/_to_delete/*"
  to = "/404.html"
  status = 404
  force = true

# La cartella firebase/ (regole e Cloud Functions) sta nel repository ma non fa
# parte del sito: non deve essere raggiungibile
[[redirects]]
  from = "/firebase/*"
  to = "/404.html"
  status = 404
  force = true


# ---------------------------------------------------------------------------
# Header di sicurezza (tutte le pagine)
# Content-Security-Policy in modalità "Report-Only": NON blocca nulla, segnala
# soltanto in console (F12) cosa verrebbe bloccato. Dopo le verifiche si rinomina
# l'header in "Content-Security-Policy" per renderla attiva.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://consent.cookiebot.com https://consentcdn.cookiebot.com https://consent.cookiebot.eu https://consentcdn.cookiebot.eu https://connect.facebook.net https://sibforms.com https://www.google.com/recaptcha/ https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://sibforms.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://assets.brevo.com; img-src 'self' data: blob: https://www.facebook.com https://*.cookiebot.com https://*.cookiebot.eu https://www.google.com https://www.gstatic.com; connect-src 'self' https://*.cookiebot.com https://*.cookiebot.eu https://www.facebook.com https://connect.facebook.net https://sibforms.com https://*.sibforms.com https://www.google.com/recaptcha/ https://firestore.googleapis.com https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://consentcdn.cookiebot.com https://consentcdn.cookiebot.eu https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://recaptcha.google.com https://otpgea-iscrizioni.firebaseapp.com; form-action 'self' https://sibforms.com https://*.sibforms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Pagine riservate: esclusione dai motori di ricerca anche via header
[[headers]]
  for = "/ps-admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ps-form-iscrizioni.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Cache del browser per i file statici
# Immagini e video: 7 giorni. PDF e documenti in /files/: 1 giorno, perché
# vengono aggiornati più spesso (bollettini, classifiche) mantenendo lo stesso nome.
# Alla scadenza il browser chiede a Netlify se il file è cambiato e lo riscarica
# solo se serve. Le pagine HTML restano senza cache (default Netlify): una
# modifica al sito è sempre visibile subito.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
